name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Versiya ATAYLAB berilmaydi: `package.json`dagi `packageManager` bitta
      # manba. Ikkalasi ham berilsa action `Multiple versions of pnpm
      # specified` bilan yiqiladi — butun `web` job'i shu sababdan qizil edi.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck

  # API testlari ilgari CI'da UMUMAN yurmagan: `pnpm-workspace.yaml` faqat
  # `apps/*` va `packages/*` ni qamraydi, `api/` da `package.json` yo'q, ya'ni
  # `turbo run test` pytest'ga hech qachon yetmasdi. Natijada RLS invariantlari
  # va auth testlari — aynan prod'da bir necha marta buzilgan joylar — hech
  # narsa bilan majburlanmasdi.
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: playbron
          POSTGRES_PASSWORD: playbron
          POSTGRES_DB: playbron
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U playbron"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    # `DIRECT_URL` — migratsiya va fixture'lar uchun baza egasi (bu yerda u
    # superuser). `DATABASE_URL` esa prod'dagi kabi `playbron_app`: rollarni
    # `0001_core.py` shu `APP_DB_PASSWORD`/`PLATFORM_DB_PASSWORD` bilan
    # yaratadi. Ilgari ilova ham superuser bilan ulanardi — superuser RLS'ni
    # BUTUNLAY chetlab o'tadi, ya'ni bu job RLS invariantlarini tekshirmasdan
    # o'tkazib yuborardi (aynan shu testlar prod xatolarini ushlashi kerak edi).
    env:
      ENV: test
      JWT_SECRET: ci-uchun-32-baytdan-uzun-tasodifiy-bolmagan-qiymat
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: postgresql://playbron_app:ci-app-paroli@localhost:5432/playbron
      DIRECT_URL: postgresql://playbron:playbron@localhost:5432/playbron
      PLATFORM_DATABASE_URL: postgresql://playbron_platform:ci-platform-paroli@localhost:5432/playbron
      APP_DB_PASSWORD: ci-app-paroli
      PLATFORM_DB_PASSWORD: ci-platform-paroli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -e '.[dev]'
        working-directory: api

      - run: ruff check src tests migrations
        working-directory: api

      # `playbron_app`/`playbron_platform` rollari shu qadamda tug'iladi —
      # undan oldin `DATABASE_URL` bilan ulanib bo'lmaydi.
      - run: alembic upgrade head
        working-directory: api

      # `RUN_DB_TESTS=1` bo'lmasa DB'ga tegadigan testlar JIMGINA skip bo'ladi
      # va CI yashil qolaveradi — ya'ni bayroqsiz bu qadam deyarli bekor.
      - run: pytest -q
        working-directory: api
        env:
          RUN_DB_TESTS: '1'

  # Render bepul rejasining nusxasi: baza egasi superuser EMAS va
  # `playbron_platform` BYPASSRLS OLA OLMAYDI. Lokal `docker compose` bazasi
  # superuser bo'lgani uchun RLS policy'lari u yerda umuman baholanmaydi —
  # prod'dagi uchta bloklovchi xato va `set_staff_password.py`/
  # `super_admin_bootstrap.py` dagi «xodim topilmadi» yolg'on xatosi aynan
  # shu ko'r nuqtadan chiqqan edi (`api` job'i buni HECH QACHON ushlamaydi).
  # Migratsiyalardagi `_assert_*` tekshiruvlari va butun test to'plami shu
  # yerda — real RLS ostida — qayta yuritiladi.
  api-render-shape:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: root
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      ENV: test
      JWT_SECRET: ci-uchun-32-baytdan-uzun-tasodifiy-bolmagan-qiymat
      REDIS_URL: redis://localhost:6379/0
      ALLOW_SINGLE_DB_ROLE: '1'
      DATABASE_URL: postgresql://owner:owner@localhost:5432/playbron
      DIRECT_URL: postgresql://owner:owner@localhost:5432/playbron
      PLATFORM_DATABASE_URL: postgresql://owner:owner@localhost:5432/playbron
      APP_DB_PASSWORD: ci-app-paroli
      PLATFORM_DB_PASSWORD: ci-platform-paroli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -e '.[dev]'
        working-directory: api

      # `CREATEROLE` bor, `SUPERUSER` va `BYPASSRLS` yo'q — Render'dagi holat.
      - name: Render shaklidagi egani yaratish
        run: |
          PGPASSWORD=root psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE owner LOGIN PASSWORD 'owner' NOSUPERUSER CREATEROLE NOCREATEDB NOBYPASSRLS;" \
            -c "CREATE DATABASE playbron OWNER owner;"

      - run: alembic upgrade head
        working-directory: api

      # Butun to'plam shu yerda — real (superuser'siz, BYPASSRLS'siz) RLS
      # ostida. Ilgari faqat `test_policy_invariants.py` yurardi: qolgan
      # fixture'lar `_owner_engine()` orqali xom INSERT/DELETE qilar, `app.*`
      # GUC qo'ymas edi — bu superuser'siz bazada RLS tomonidan RAD ETILARDI.
      # Endi har bir fixture GUC qo'yadi yoki (`tests/conftest.py`dagi
      # `rls_bypass()`) FORCE RLS'ni vaqtincha olib turib, tabiiy aktorsiz
      # ob'ekt grafini quradi — xuddi `0005_two_worlds_auth.py`dagi
      # `_force_rls()` kabi.
      - run: pytest -q
        working-directory: api
        env:
          RUN_DB_TESTS: '1'
