[project]
name = "playbron-api"
version = "0.1.0"
description = "PlayBron — PlayStation klublari uchun multi-tenant bron SaaS backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    # Alembic sinxron drayver bilan ishlaydi — DIRECT_URL egasi roli orqali
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "pyjwt>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "ASYNC"]
ignore = [
    "S101",   # pytest'da assert
    "N818",   # xato sinflari `Error` qo'shimchasisiz — `code` maydoni asosiy identifikator
    "B008",   # FastAPI Depends() imzoda chaqiriladi
]

[tool.ruff.lint.per-file-ignores]
# S608: DDL (CREATE ROLE) bind parametr qabul qilmaydi — kirish `_safe_password` bilan cheklangan
"migrations/**" = ["N806", "E501", "S608"]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Modul darajasidagi engine va Redis mijozi birinchi event loop'ga bog'lanadi.
# Har test uchun yangi loop ochilsa ular "Event loop is closed" beradi —
# shuning uchun butun sessiya bitta loop'da ishlaydi.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
