# PlayBron — Render Blueprint (vaqtinchalik muhit).
#
# Render Dashboard → Blueprints → New Blueprint Instance → shu repo.
# `sync: false` bo'lgan o'zgaruvchilar sir — dashboard'da qo'lda to'ldiriladi.
#
# Baza Render'da EMAS — Supabase bepul rejasida (docs/04-deploy-render.md, 2a):
# Render bepul Postgres'i 90 kunda o'chadi, Supabase'niki muddatsiz. Bonus:
# Supabase `CREATE ROLE` ga ruxsat beradi, ya'ni RLS'ning ikki-rol modeli
# (egasi migratsiya uchun, `playbron_app` runtime uchun) to'liq kuchda.

# DIQQAT: Redis va API **bitta regionda** bo'lishi shart. Render'ning ichki
# tarmog'i regionlar orasida ishlamaydi — API boshqa regionda bo'lsa Redis
# manzili umuman hal bo'lmaydi va konteyner start'da qotib qoladi.
# Region xizmat yaratilgandan keyin o'zgarmaydi: noto'g'ri bo'lsa o'chirib qayta yaratiladi.
# Supabase loyihasi ham geografik yaqin regionda bo'lsin (West US) — har so'rov latensiyasi.

services:
  # ── Redis (replay himoyasi, kesh) ────────────────────────────────────────
  - type: keyvalue
    name: playbron-redis
    plan: free
    region: oregon
    ipAllowList: [] # faqat ichki tarmoq

  # ── API ──────────────────────────────────────────────────────────────────
  - type: web
    name: playbron-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /healthz
    envVars:
      - key: ENV
        value: prod
      - key: DEBUG
        value: 'false'

      # ── Supabase Postgres (tashqi baza) ───────────────────────────────
      # Uchala satr parol saqlaydi — dashboard'da qo'lda kiritiladi.
      # Session pooler (port 5432) ishlatiladi: to'g'ridan-to'g'ri host bepul
      # rejada IPv6-only, transaction pooler (6543) esa asyncpg'ning prepared
      # statement'lari bilan chiqishmaydi. Pooler'da foydalanuvchi nomi
      # `rol.PROJECT_REF` ko'rinishida (masalan `playbron_app.abcdefgh`).
      # Sxema (`postgres://`) `core/config.py` da drayverga moslanadi.
      - key: DATABASE_URL # playbron_app roli — RLS ostidagi runtime
        sync: false
      - key: DIRECT_URL # postgres (egasi) — migratsiya va seed
        sync: false
      - key: PLATFORM_DATABASE_URL # playbron_platform — BYPASSRLS'siz (Faza 7 gacha)
        sync: false

      # `0001_core` rollarni shu parollar bilan yaratadi. Supabase ochiq
      # internetda — kuchli qiymat SHART (sukut "app"/"platform" emas!).
      # Faqat [A-Za-z0-9_-] ishlatilsin: parol DATABASE_URL ichiga ham kiradi,
      # boshqa belgilar URL'da yoki DDL'da muammo chiqaradi.
      - key: APP_DB_PASSWORD
        sync: false
      - key: PLATFORM_DB_PASSWORD
        sync: false

      - key: REDIS_URL
        fromService:
          name: playbron-redis
          type: keyvalue
          property: connectionString

      # Render o'zi 32 baytli tasodifiy qiymat yasaydi
      - key: JWT_SECRET
        generateValue: true
      - key: TG_WEBHOOK_SECRET
        generateValue: true

      # ── Qo'lda kiritiladigan YAGONA qiymatlar ─────────────────────────
      # Sir. Repo ochiq, shuning uchun bu yerda faqat `sync: false` turadi —
      # qiymat Dashboard → playbron-api → Environment da kiritiladi.
      # @BotFather'dan olinadi.
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      # ──────────────────────────────────────────────────────────────────

      # Sir emas — oddiy Telegram ID. Qiymat shu yerda turgani uchun
      # `0002_seed` migratsiyasi super adminni birinchi deployda o'zi yaratadi.
      # Bepul rejada Render Shell yo'q, qo'lda seed qilib bo'lmaydi.
      - key: SUPER_ADMIN_TELEGRAM_IDS
        value: '611207125'

      # Manzil xizmat nomidan kelib chiqadi — oldindan ma'lum, kutish shart emas.
      - key: CORS_ORIGINS
        value: 'https://playbron-admin.onrender.com,https://playbron-miniapp.onrender.com'

      - key: GRACE_DAYS
        value: '3'
      - key: SUBSCRIPTION_WARN_DAYS
        value: '3'

  # ── Konsol (xodim + klub admini) ─────────────────────────────────────────
  - type: web
    name: playbron-admin
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter admin build
    staticPublishPath: ./apps/admin/dist
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Vite qiymatni BUILD paytida kodga singdiradi. Shu yerda turgani uchun
      # birinchi build'dayoq to'g'ri bo'ladi — qayta deploy qilish shart emas.
      - key: VITE_API_URL
        value: 'https://playbron-api.onrender.com/api/v1'
      - key: VITE_TELEGRAM_LOGIN_BOT
        value: playbronadminbot
    routes:
      # SPA: barcha manzillar index.html ga (react-router BrowserRouter)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # ── Mijoz Mini App ───────────────────────────────────────────────────────
  - type: web
    name: playbron-miniapp
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter miniapp build
    staticPublishPath: ./apps/miniapp/dist
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_URL
        value: 'https://playbron-api.onrender.com/api/v1'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Telegram Mini App'ni iframe'da ochadi — SAMEORIGIN mumkin emas
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
