# PlayBron — Render Blueprint (vaqtinchalik muhit).
#
# Render Dashboard → Blueprints → New Blueprint Instance → shu repo.
# `sync: false` bo'lgan o'zgaruvchilar dashboard'da qo'lda to'ldiriladi
# (ular sir yoki birinchi deploydan keyin ma'lum bo'ladigan manzillar).
#
# Bepul Postgres'da `CREATE ROLE` bo'lmasligi mumkin — migratsiya buni
# ko'taradi: ilova baza egasi roli bilan ulanadi va RLS baribir kuchda qoladi,
# chunki jadvallarga `FORCE ROW LEVEL SECURITY` qo'llangan.

# ── Domenlar: ikki qadam ─────────────────────────────────────────────────
#   playbron.uz       → landing (apex; Render `www.` ni qo'shib bu yerga yo'naltiradi)
#   app.playbron.uz   → xodim va klub admini ilovasi
#   mini.playbron.uz  → mijoz Mini App'i
#   api.playbron.uz   → API
#
# 1-qadam (BAJARILGAN): quyidagi `domains:` ro'yxatlari. Render domenlarni
#    yaratadi va DNS yozuvlarini ko'rsatadi; tasdiqlanmaguncha xizmatlar
#    `.onrender.com` da ishlayveradi, hech narsa sinmaydi.
# 2-qadam (DNS tasdiqlangandan KEYIN): quyidagi qiymatlar almashtiriladi —
#    ilgari qilinsa saytlar hali ochilmagan manzilga murojaat qilib qoladi.
#      playbron-landing  SITE_URL         → https://playbron.uz
#      playbron-admin    VITE_LANDING_URL → https://playbron.uz
#      playbron-admin    VITE_API_URL     → https://api.playbron.uz/api/v1
#      playbron-miniapp  VITE_API_URL     → https://api.playbron.uz/api/v1
#      playbron-api      CORS_ORIGINS     → https://playbron.uz,https://www.playbron.uz,
#                                           https://app.playbron.uz,https://mini.playbron.uz
#      playbron-api      PUBLIC_URL       → https://api.playbron.uz
#    `VITE_*` build paytida kodga singdiriladi — o'zgartirgach qayta deploy shart.

# DIQQAT: baza, Redis va API **bitta regionda** bo'lishi shart. Render'ning ichki
# tarmog'i regionlar orasida ishlamaydi — API boshqa regionda bo'lsa baza va
# Redis manzillari umuman hal bo'lmaydi va konteyner start'da qotib qoladi.
# Region xizmat yaratilgandan keyin o'zgarmaydi: noto'g'ri bo'lsa o'chirib qayta yaratiladi.

databases:
  - name: playbron-db
    databaseName: playbron
    user: playbron
    plan: free
    region: oregon
    # Tashqi internetdan ulanish yopiq — bazaga faqat Render ichki tarmog'i
    # (API konteyner) yetadi. Tashqaridan psql kerak bo'lib qolsa, o'z IP'ingizni
    # vaqtincha shu ro'yxatga qo'shib Manual Sync qilinadi.
    ipAllowList: []

services:
  # ── Redis (replay himoyasi, kesh) ────────────────────────────────────────
  - type: keyvalue
    name: playbron-redis
    plan: free
    region: oregon
    ipAllowList: [] # faqat ichki tarmoq

  # ── API ──────────────────────────────────────────────────────────────────
  - type: web
    name: playbron-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /healthz
    domains:
      - api.playbron.uz
    envVars:
      - key: ENV
        value: prod
      - key: DEBUG
        value: 'false'

      # Uchala ulanish bitta bazaga: bepul rejada alohida rol yaratib bo'lmaydi.
      # Sxema (`postgres://`) `core/config.py` da drayverga moslanadi.
      - key: DATABASE_URL
        fromDatabase:
          name: playbron-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: playbron-db
          property: connectionString
      - key: PLATFORM_DATABASE_URL
        fromDatabase:
          name: playbron-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: playbron-redis
          type: keyvalue
          property: connectionString

      # Render o'zi 32 baytli tasodifiy qiymat yasaydi
      - key: JWT_SECRET
        generateValue: true
      - key: TG_WEBHOOK_SECRET
        generateValue: true

      # Rol parollari. Bo'lmasa `0001_core` rollarni zaif sukut parollari
      # ("app"/"platform") bilan yaratardi — LOGIN roli tashqi tarmoqqa ochiq
      # bazada bu teshik. `0004_role_passwords` mavjud rollarning parolini
      # shu qiymatlarga almashtiradi.
      - key: APP_DB_PASSWORD
        generateValue: true
      - key: PLATFORM_DB_PASSWORD
        generateValue: true

      # ── Qo'lda kiritiladigan YAGONA qiymatlar ─────────────────────────
      # Sir. Repo ochiq, shuning uchun bu yerda faqat `sync: false` turadi —
      # qiymat Dashboard → playbron-api → Environment da kiritiladi.
      # @BotFather'dan olinadi.
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      # ──────────────────────────────────────────────────────────────────

      # Sir emas — oddiy Telegram ID. Qiymat shu yerda turgani uchun
      # `0002_seed` migratsiyasi super adminni birinchi deployda o'zi yaratadi.
      # Bepul rejada Render Shell yo'q, qo'lda seed qilib bo'lmaydi.
      - key: SUPER_ADMIN_TELEGRAM_IDS
        value: '611207125'

      # Manzil xizmat nomidan kelib chiqadi — oldindan ma'lum, kutish shart emas.
      - key: CORS_ORIGINS
        value: 'https://playbron-admin.onrender.com,https://playbron-miniapp.onrender.com'

      - key: GRACE_DAYS
        value: '3'
      - key: SUBSCRIPTION_WARN_DAYS
        value: '3'

  # ── Konsol (xodim + klub admini) ─────────────────────────────────────────
  - type: web
    name: playbron-admin
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter admin build
    staticPublishPath: ./apps/admin/dist
    domains:
      - app.playbron.uz
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Vite qiymatni BUILD paytida kodga singdiradi. Shu yerda turgani uchun
      # birinchi build'dayoq to'g'ri bo'ladi — qayta deploy qilish shart emas.
      - key: VITE_API_URL
        value: 'https://playbron-api.onrender.com/api/v1'
      - key: VITE_TELEGRAM_LOGIN_BOT
        value: playbronadminbot
      # Kirish ekranidagi «saytga qaytish» tugmasi. Domen ulangach playbron.uz
      - key: VITE_LANDING_URL
        value: 'https://playbron-landing.onrender.com'
    routes:
      # SPA: barcha manzillar index.html ga (react-router BrowserRouter)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # ── Landing (playbron.uz) ────────────────────────────────────────────────
  # Astro statik chiqishi: `/index.html` (uz) va `/ru/index.html`.
  # SPA rewrite YO'Q — mavjud bo'lmagan manzil haqiqiy 404 qaytarishi kerak,
  # aks holda qidiruv tizimlari har qanday URL'ni sahifa deb indekslaydi.
  - type: web
    name: playbron-landing
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter landing build
    staticPublishPath: ./apps/landing/dist
    # Apex berilgani uchun Render `www.playbron.uz` ni o'zi qo'shib apex'ga
    # yo'naltiradi — canonical va sitemap ham apex'ni ko'rsatadi.
    domains:
      - playbron.uz
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Canonical, hreflang, sitemap va robots.txt shu manzildan yasaladi.
      # playbron.uz domeni ulangach shu qiymat 'https://playbron.uz' ga
      # o'zgartiriladi (va playbron-admin dagi VITE_LANDING_URL ham).
      - key: SITE_URL
        value: 'https://playbron-landing.onrender.com'
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # ── Mijoz Mini App ───────────────────────────────────────────────────────
  - type: web
    name: playbron-miniapp
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter miniapp build
    staticPublishPath: ./apps/miniapp/dist
    domains:
      - mini.playbron.uz
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_URL
        value: 'https://playbron-api.onrender.com/api/v1'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Telegram Mini App'ni iframe'da ochadi — SAMEORIGIN mumkin emas
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
